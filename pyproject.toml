[project]
name = "shape-shifter"
version = "0.1.0"
description = "A project for generating ad creatives."
requires-python = ">=3.10"
dependencies = [
    "click",
    "google-cloud-aiplatform",
    "google-cloud-storage",
    "protobuf",
    "dirtyjson",
    "grpcio-tools",
    "ruff>=0.14.7",
    "google-genai>=1.52.0",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]
